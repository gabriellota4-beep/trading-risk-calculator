<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Risk Calculator</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <header>
        <h1>Trading Risk Calculator</h1>
    </header>

    <main>
        <section class="container">

            <label for="account">Account Size ($)</label>
            <input type="number" id="account" placeholder="e.g. 5000">

            <label for="risk">Risk (%)</label>
            <input type="number" id="risk" placeholder="e.g. 1">

            <label for="stop">Stop Loss (points)</label>
            <input type="number" id="stop" placeholder="e.g. 50">

            <button onclick="calculate()">Calculate</button>

            <section id="result"></section>

        </section>
    </main>

    <footer>
        <p>TRADCAL - Trading Risk Calculator</p>
    </footer>

    <script src="assets/js/script.js"></script>

</body>
</html>
